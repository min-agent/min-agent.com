# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # A rerun can still see artifacts uploaded by earlier attempts.
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          # Upload entire repository
          path: '.'

      - name: Wait for the Pages artifact to be listed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if listed_id=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f "name=$PAGES_ARTIFACT_NAME" \
              --jq '.artifacts[] | select(.expired == false) | .id') &&
              [[ -n "$PAGES_ARTIFACT_ID" && "$listed_id" == "$PAGES_ARTIFACT_ID" ]]; then
              # The Pages action uses a different listing service that can lag behind REST.
              sleep 15
              exit 0
            fi
            if [[ "$attempt" != 12 ]]; then
              sleep 5
            fi
          done
          echo "::error::Pages artifact '$PAGES_ARTIFACT_NAME' (ID $PAGES_ARTIFACT_ID) was not listed after upload."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}

      - name: Wait before retrying the Pages deployment
        if: steps.deployment.outcome == 'failure'
        shell: bash
        run: sleep 30

      - name: Retry deployment to GitHub Pages
        if: steps.deployment.outcome == 'failure'
        id: deployment-retry
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
